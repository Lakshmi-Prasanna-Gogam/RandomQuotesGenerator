<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Dashboard</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}
body{
background:#eef2f7;
display:flex;
flex-direction:column;
align-items:center;
padding:30px;
}
h1{
color:#1b263b;
margin-bottom:20px;
}
.kpi-container{
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
margin-bottom:20px;
}
.kpi{
background:white;
padding:15px 20px;
border-radius:12px;
width:200px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
text-align:center;
}
.kpi h2{
font-size:22px;
color:#1b263b;
}
.kpi p{
font-size:13px;
color:#666;
margin-top:5px;
}
.container{
background:white;
padding:25px;
border-radius:12px;
width:850px;
max-width:100%;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
.chart{
position:relative;
display:flex;
align-items:flex-end;
justify-content:space-between;
height:320px;
padding:20px;
border-left:2px solid #ccc;
border-bottom:2px solid #ccc;
background:linear-gradient(to top,#f8fafc 50%,transparent 50%);
}
.chart::before{
content:"";
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
background-image:repeating-linear-gradient(to top,rgba(0,0,0,0.05),rgba(0,0,0,0.05) 1px,transparent 1px,transparent 40px);
pointer-events:none;
}
.bar{
width:100%;
margin:0 6px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-end;
position:relative;
}
.bar-fill{
width:100%;
background:linear-gradient(180deg,#4f46e5,#778da9);
border-radius:6px 6px 0 0;
transition:0.5s;
}
.value{
position:absolute;
top:-22px;
font-size:12px;
color:#1b263b;
font-weight:bold;
}
.label{
margin-top:8px;
font-size:12px;
color:#555;
}

.back-btn{
margin-top:25px;
padding:12px 28px;
background:linear-gradient(135deg,#1b263b,#415a77);
color:white;
border:none;
border-radius:12px;
cursor:pointer;
font-size:15px;
font-weight:600;
box-shadow:0 8px 18px rgba(27,38,59,0.25);
transition:0.3s;
}

.back-btn:hover{
transform:translateY(-3px);
box-shadow:0 12px 25px rgba(27,38,59,0.35);
background:linear-gradient(135deg,#415a77,#1b263b);
}

.back-btn:active{
transform:scale(0.96);
}

/* RANGE SELECTOR */
#range{
margin:15px 0 25px 0;
padding:10px 45px 10px 15px;
font-size:15px;
font-weight:600;
color:#1b263b;
background:white;
border:2px solid #1b263b;
border-radius:10px;
cursor:pointer;
outline:none;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
appearance:none;
background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24'%3E%3Cpath fill='%231b263b' d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
background-repeat:no-repeat;
background-position:right 15px center;
}

#range:hover{
background-color:#f1f5f9;
}

#range:focus{
border-color:#4f46e5;
box-shadow:0 0 0 3px rgba(79,70,229,0.2);
}


#range option{
background:white;
color:#1b263b;
font-weight:500;
}
</style>
</head>
<body>
<h1>📊 Quotes Analytics Dashboard</h1>
<select id="range" onchange="loadAnalytics()">
<option value="day">Today</option>
<option value="week">Last 7 Days</option>
<option value="month">Last 30 Days</option>
<option value="all">All Time</option>
</select>
<br>
<div class="kpi-container">
<div class="kpi">
<h2 id="viewed">0</h2>
<p>Quotes Viewed</p>
</div>
<div class="kpi">
<h2 id="saved">0</h2>
<p>Quotes Saved</p>
</div>
<div class="kpi">
<h2 id="shared">0</h2>
<p>Quotes Shared</p>
</div>
</div>
<div class="container">
<div class="chart" id="chart"></div>
</div>
<button class="back-btn" onclick="goBack()">← Back to Home</button>
<script>
async function loadAnalytics(){
const userId=localStorage.getItem("userId");
const range=document.getElementById("range").value;
const response=await fetch(`/analytics/${userId}?range=${range}`);
const data=await response.json();
document.getElementById("viewed").innerText=data.viewed || 0;
document.getElementById("saved").innerText=data.saved || 0;
document.getElementById("shared").innerText=data.shared || 0;
const chart=document.getElementById("chart");
let values=[
{
label:"Viewed",
count:data.viewed || 0
},
{
label:"Saved",
count:data.saved || 0
},
{
label:"Shared",
count:data.shared || 0
}
];
let max=Math.max(...values.map(v=>v.count),1);
let html="";
values.forEach(v=>{
let height=(v.count/max)*260;
html+=`
<div class="bar">
<div class="value">${v.count}</div>
<div class="bar-fill" style="height:${height}px"></div>
<div class="label">${v.label}</div>
</div>
`;
});
chart.innerHTML=html;
}
function goBack(){
window.location.href="HomePage.html";
}
loadAnalytics();
setInterval(loadAnalytics,3000);
</script>
</body>
</html>
